name: CI

on:
  push:
    branches: [ main, storyboard-work, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint pytest
    
    - name: Run pylint
      run: |
        pylint aim_trainer_*.py --fail-under=9.0
    
    - name: Run pytest
      run: |
        pytest -v
