name: CI

on:
  push:
    branches: [ main, storyboard-main, storyboard-work, feature/* ]
  pull_request:
    branches: [ main, storyboard-main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pylint pytest

    - name: Run pylint
      run: |
        python -m pylint src/*.py --rcfile=pyproject.toml --fail-under=9.0

    - name: Run pytest
      run: |
        python -m pytest tests -v --tb=short
